{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Colégio Shalom</h1>
        <p class="text-muted mb-4">Sistema de Gestão Escolar</p>
        <form method="post" novalidate>{% csrf_token %}
          {% for campo in form %}
          <div class="mb-3">
            <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
            <input class="form-control" type="{{ campo.field.widget.input_type }}" name="{{ campo.html_name }}"
                   id="{{ campo.id_for_label }}" value="{% if campo.html_name != 'password' %}{{ campo.value|default:'' }}{% endif %}" required>
          </div>
          {% endfor %}
          <button class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
